<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>拾作</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="paper-theme.css" />
  <style>
    /* Hallmark · genre: modern-minimal · macrostructure: Compact launcher · tone: soft · anchor hue: coral · theme: Coral · design-system: design.md */
    /* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V4 */
    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body {
      width: 20rem;
      margin: 0;
      padding: var(--space-sm);
      color: var(--color-ink);
      background: var(--color-paper);
      font: var(--text-sm)/1.45 var(--font-body);
    }
    .popup-brand {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      min-width: 0;
    }
    .popup-brand img {
      width: 2.25rem;
      height: 2.25rem;
      display: block;
      flex: 0 0 auto;
    }
    .popup-brand-copy { min-width: 0; }
    h1 {
      margin: 0;
      color: var(--color-ink);
      font: 650 var(--text-lg)/1.1 var(--font-display);
      letter-spacing: -0.02em;
    }
    .popup-brand-copy span {
      display: block;
      margin-top: var(--space-3xs);
      color: var(--color-neutral);
      font-size: var(--text-xs);
      white-space: nowrap;
    }
    button,
    summary {
      min-height: 2.75rem;
      font: 600 var(--text-sm)/1 var(--font-body);
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button {
      margin: 0;
      padding: 0 var(--space-xs);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-sm);
      color: var(--color-ink-2);
      background: var(--color-surface);
      text-align: left;
      transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), transform var(--dur-press) var(--ease-out);
    }
    button:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    button:active,
    summary:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.55;
      color: var(--color-muted);
      cursor: not-allowed;
    }
    .save-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 2.75rem;
      margin-top: var(--space-sm);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    #savePage {
      width: 100%;
      min-width: 0;
      border-color: var(--color-accent);
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      color: var(--color-accent-ink);
      background: var(--color-accent);
    }
    details { position: relative; }
    summary {
      display: grid;
      place-items: center;
      list-style: none;
      border: 1px solid var(--color-accent);
      border-left-color: var(--color-accent-strong);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      color: var(--color-accent-ink);
      background: var(--color-accent);
      transition: background-color var(--dur-short) var(--ease-out), transform var(--dur-press) var(--ease-out);
    }
    summary::-webkit-details-marker { display: none; }
    details[open] summary { background: var(--color-accent-strong); }
    details[data-disabled="true"] summary {
      opacity: 0.55;
      cursor: not-allowed;
      pointer-events: none;
    }
    .chevron {
      width: var(--space-xs);
      height: var(--space-xs);
      display: block;
      transition: transform var(--dur-short) var(--ease-out);
    }
    details[open] .chevron { transform: rotate(180deg); }
    .format-menu {
      position: absolute;
      top: calc(100% + var(--space-2xs));
      right: 0;
      z-index: var(--z-menu);
      width: 11.5rem;
      padding: var(--space-3xs);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-sm);
      background: var(--color-surface-raised);
      box-shadow: var(--shadow-md);
    }
    .format-menu button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 2.5rem;
      padding-inline: var(--space-xs);
      border: 0;
      border-radius: var(--radius-xs);
      background: transparent;
      box-shadow: none;
    }
    .format-menu button[aria-checked="true"] {
      color: var(--color-accent-strong);
      background: var(--color-accent-soft);
    }
    .format-menu button[aria-checked="true"]::after {
      content: "✓";
      color: var(--color-accent-strong);
      font-weight: 700;
    }
    #openWorkspace {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: var(--space-2xs);
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }
    #openWorkspace::after {
      content: "→";
      color: var(--color-muted);
      font-size: var(--text-md);
      font-weight: 400;
    }
    #status {
      margin: var(--space-2xs) var(--space-3xs) 0;
      color: var(--color-neutral);
      line-height: 1.4;
      font-size: var(--text-xs);
    }
    #status:empty { display: none; }
    #status.error { color: var(--color-danger); }
    @media (hover: hover) and (pointer: fine) {
      #savePage:hover,
      summary:hover {
        border-color: var(--color-accent-strong);
        color: var(--color-accent-ink);
        background: var(--color-accent-strong);
      }
      #openWorkspace:hover,
      .format-menu button:hover {
        border-color: transparent;
        color: var(--color-ink);
        background: var(--color-accent-soft);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      button,
      summary,
      .chevron { transition-duration: 150ms; }
      button:active,
      summary:active { transform: none; }
    }
  </style>
</head>
<body data-surface="popup">
  <div class="popup-brand"><img src="icons/icon32.png" alt="" /><div class="popup-brand-copy"><h1>拾作</h1><span>收集、理解、创作</span></div></div>
  <div class="save-row">
    <button id="savePage" type="button">保存当前页 · Markdown</button>
    <details id="formatMenu">
      <summary aria-label="选择保存格式" aria-haspopup="menu" title="选择保存格式">
        <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.25 6 7.75l3.5-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>
      </summary>
      <div class="format-menu" role="menu" aria-label="保存格式">
        <button id="saveMarkdown" type="button" role="menuitemradio" aria-checked="true">Markdown</button>
        <button id="savePdf" type="button" role="menuitemradio" aria-checked="false">PDF</button>
      </div>
    </details>
  </div>
  <button id="openWorkspace" type="button">打开拾作</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
